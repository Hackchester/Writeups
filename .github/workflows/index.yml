# Rebuilds index.json (read by hackchester.net) when a writeup changes on main.
name: build index

on:
  push:
    branches: [main]
    paths: ["writeups/**", "scripts/build_index.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 scripts/build_index.py
      - name: Commit index.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet && echo "unchanged" && exit 0
          git commit -m "chore: rebuild index.json [skip ci]"
          git push
